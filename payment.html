<!doctype html>
<meta charset="utf-8">
<title>Оплата — SafeInCloud test site</title>
<h1>Оплата</h1>
<form method="get" action="payment.html">
  <p><label>Номер карты <input type="text" name="cardnumber" autocomplete="cc-number"></label></p>
  <p><label>Владелец <input type="text" name="ccname" autocomplete="cc-name"></label></p>
  <p><label>Действует до <input type="text" name="ccexp" autocomplete="cc-exp" placeholder="MM/YYYY"></label></p>
  <p><label>CVV <input type="text" name="cvc" autocomplete="cc-csc"></label></p>
  <p><button type="submit">Оплатить</button></p>
</form>
<p><a href="index.html">назад</a></p>
