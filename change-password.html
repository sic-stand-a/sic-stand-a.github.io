<!doctype html>
<meta charset="utf-8">
<title>Смена пароля — SafeInCloud test site</title>
<h1>Смена пароля</h1>
<form method="get" action="change-password.html">
  <p><label>Логин <input type="text" name="username" autocomplete="username"></label></p>
  <p><label>Прежний пароль <input type="password" name="old" autocomplete="current-password"></label></p>
  <p><label>Новый пароль <input type="password" name="new" autocomplete="new-password"></label></p>
  <p><button type="submit">Сменить</button></p>
</form>
<p><a href="index.html">назад</a></p>
